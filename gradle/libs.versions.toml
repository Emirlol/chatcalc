[versions]
# https://fabricmc.net/develop/
minecraft = "1.21.10"
yarnMappings = "1.21.10+build.3"
fabricLoader = "0.18.3"
fabricApi = "0.138.4+1.21.10"

fabricLanguageKotlin = "1.13.8+kotlin.2.3.0" # https://github.com/FabricMC/fabric-language-kotlin/releases

kotlin = "2.3.0" # Match this to the one above
loom = "1.14-SNAPSHOT" # https://github.com/FabricMC/fabric-loom/releases
modPublish = "1.1.0" # https://github.com/modmuss50/mod-publish-plugin
ksp = "2.3.4" #https://github.com/google/ksp/releases

rimelib = "2.3.4+1.21.10" # https://modrinth.com/mod/rimelib
config = "1.0.3"
pods4k = "0.7.0" # https://github.com/daniel-rusu/pods4k/releases

kotest = "6.0.7" # https://kotest.io/
junit = "6.0.1"

[libraries]
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
yarnMappings = { module = "net.fabricmc:yarn", version.ref = "yarnMappings" }
fabricLoader = { module = "net.fabricmc:fabric-loader", version.ref = "fabricLoader" }
fabricLanguageKotlin = { module = "net.fabricmc:fabric-language-kotlin", version.ref = "fabricLanguageKotlin" }
fabricApi = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabricApi" }
rimelib = { module = "me.ancientri:rimelib", version.ref = "rimelib" }
config-annotation = { module = "me.ancientri.symbols:config-annotation", version.ref = "config" }
config-processor = { module = "me.ancientri.symbols:config-processor", version.ref = "config" }
pods4k = { module = "com.danrusu.pods4k:pods4k", version.ref = "pods4k" }

fabricLoaderJunit = { module = "net.fabricmc:fabric-loader-junit", version.ref = "fabricLoader" }
#kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5-jvm", version.ref = "kotest" } # Causes issues with fabric stuff
junitJupiterParams = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core-jvm", version.ref = "kotest" }
kotest-property = { module = "io.kotest:kotest-property-jvm", version.ref = "kotest" }

[bundles]
test = [
    "fabricLoaderJunit",
    "junitJupiterParams",
#    "kotest-runner-junit5",
    "kotest-assertions-core",
    "kotest-property"
]

[plugins]
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
loom = { id = "fabric-loom", version.ref = "loom" }
modPublish = { id = "me.modmuss50.mod-publish-plugin", version.ref = "modPublish" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }